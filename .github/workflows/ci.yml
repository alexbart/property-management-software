name: CI

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"
      - "fix/**"

  pull_request:
    branches:
      - main
      - develop

jobs:
  quality:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: property_management
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d property_management"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      API_PORT: 4000
      WEB_ORIGIN: http://localhost:5173
      DATABASE_URL: postgresql://test:test@localhost:5432/property_management
      SESSION_SECRET: test-only-secret-that-is-at-least-32-characters

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @property-platform/api db:generate

      - name: Apply database migrations
        run: pnpm --filter @property-platform/api exec prisma migrate deploy

      - name: Type check
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build